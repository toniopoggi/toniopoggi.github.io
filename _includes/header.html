<header class="site-header">
  <a class="skip-link" href="#main">Skip to content</a>
  <div class="shell nav-shell">
    <a class="brand" href="{{ '/' | relative_url }}" aria-label="Antonio Poggi, home">
      <span class="brand-mark" aria-hidden="true">AP</span>
      <span class="brand-name">Antonio Poggi</span>
    </a>

    <div class="header-actions">
      <nav class="desktop-nav" aria-label="Primary navigation">
        {% include nav-links.html %}
      </nav>

      <button class="theme-toggle" type="button" data-theme-toggle aria-label="Switch to dark mode" aria-pressed="false">
        <span class="theme-icon theme-icon-light" aria-hidden="true">☀︎</span>
        <span class="theme-icon theme-icon-dark" aria-hidden="true">☾</span>
      </button>

      <details class="nav-menu">
        <summary aria-label="Open navigation"><span></span><span></span></summary>
        <nav aria-label="Primary navigation">
          {% include nav-links.html %}
        </nav>
      </details>
    </div>
  </div>
</header>
